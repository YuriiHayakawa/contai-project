name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contai
          POSTGRES_PASSWORD: contai_ci
          POSTGRES_DB: contai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contai -d contai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ENVIRONMENT: development
      TEST_DATABASE_URL: postgresql+asyncpg://contai:contai_ci@localhost:5432/contai_test
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run mypy app

      - name: Testes e cobertura
        run: uv run pytest --cov=app/modules --cov-fail-under=80

      - name: Auditoria de dependências
        run: uv run pip-audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Auditoria de dependências
        run: npm audit
